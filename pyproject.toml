[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circle-to-search-kde"
version = "0.12.4"
description = "Circle anything on your KDE Plasma desktop and search it"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8"]

[project.scripts]
circle-to-search = "circle_to_search.app:main"

[tool.setuptools.packages.find]
include = ["circle_to_search*"]

[tool.setuptools.package-data]
circle_to_search = ["icons/*.svg", "icons/*.png", "tessdata/*.traineddata", "tessdata/LICENSE", "tessdata/models.json"]

[tool.setuptools.data-files]
"share/circle-to-search/server" = ["server/Dockerfile", "server/pyproject.toml", "server/requirements.lock", "server/README.md", "server/THIRD_PARTY.md", "server/REMOTE_ACCESS.md", "server/compose.yaml", "server/compose.build.yaml", "server/compose.swag.yaml"]
"share/circle-to-search/server/swag" = ["server/swag/*.sample"]
"share/circle-to-search/server/cts_ocr_server" = ["server/cts_ocr_server/*.py", "server/cts_ocr_server/models.json"]
"share/circle-to-search/server/tests" = ["server/tests/*.py"]
