# Save this file as compose.yaml in any folder on your NAS.
# Edit the OCR token and render-group number below. SWAG uses the server network.
name: cts-ocr

services:
  ocr:
    image: ghcr.io/szynszyling/cts-ocr:latest
    container_name: cts-ocr
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "RENDER_GROUP_ID" # Replace with: stat -c %g /dev/dri/renderD128
    environment:
      CTS_OCR_SERVER_TOKEN: "" # Paste your existing OCR token here; required.
      CTS_OCR_DETECTOR_SCALE: "2"
    command: ["--host", "0.0.0.0", "--gpu-index", "0"]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 4.0
    networks:
      - server
networks:
  server:
    external: true
