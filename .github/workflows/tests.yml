name: Tests and container releases
on:
  push:
    branches: [main]
    tags: ['ocr-v*', 'v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-noto-cjk libegl1 libgl1 libdbus-1-3
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python tools/check_docs.py
      - run: python tools/fetch_models.py
      - run: QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -v
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: choco install tesseract --yes --no-progress
      - run: Add-Content -Path $env:GITHUB_PATH -Value "$env:ProgramFiles\Tesseract-OCR"
      - run: python -m pip install '.[dev]' ./server
      - run: python tools/fetch_models.py
      - run: python tools/fetch_test_font.py
      - name: Shared desktop and Windows tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v
      - name: Native Windows OCR engine (CPU reference)
        run: python -m circle_to_search.platforms.windows.ocr_worker --device cpu --self-test --model-dir build/ocr-models
      - name: Selected multilingual Windows GPU models
        run: python -m cts_ocr_server.bundle build/windows-multilingual --profile local --languages eng+pol+ukr+ell+kor
      - name: Multilingual Windows engine (CPU reference)
        run: python -m circle_to_search.platforms.windows.ocr_worker --device cpu --self-test --model-dir build/windows-multilingual
  backend-container:
    if: github.ref_type != 'tag' || startsWith(github.ref, 'refs/tags/ocr-v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Read container release metadata
        id: image
        shell: python
        run: |
          import os, re, tomllib
          from pathlib import Path
          version=tomllib.loads(Path('server/pyproject.toml').read_text())['project']['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+',version):
              raise SystemExit('The container release must use a numeric semantic version.')
          if os.environ['GITHUB_REF_TYPE']=='tag' and os.environ['GITHUB_REF_NAME']!='ocr-v'+version:
              raise SystemExit('The release tag must match the backend package version.')
          image='ghcr.io/'+os.environ['GITHUB_REPOSITORY_OWNER'].lower()+'/cts-ocr'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f'image={image}\nversion={version}\n')
      - run: docker build --target test -f server/Dockerfile -t cts-ocr:test .
      - name: Check selected-model local profile
        run: docker build --target test --build-arg OCR_PROFILE=local --build-arg OCR_LANGUAGES=eng+pol -f server/Dockerfile -t cts-ocr:local-test .
      - name: Build the release image
        env:
          VERSION: ${{ steps.image.outputs.version }}
        run: docker build --target final --build-arg VERSION="$VERSION" --build-arg VCS_REF="$GITHUB_SHA" -f server/Dockerfile -t cts-ocr:ci .
      - name: Check the packaged CLI
        run: docker run --rm cts-ocr:ci --help
      - name: Check single-file deployment outside the repository
        run: python tools/smoke/compose.py --image cts-ocr:ci --device cpu
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk libegl1 libgl1 libdbus-1-3
      - run: python -m pip install .
      - name: Check SWAG routing, TLS and authenticated OCR
        run: python tools/smoke/ocr_https.py --image cts-ocr:ci
      - name: Publish the tested release to GHCR
        if: startsWith(github.ref, 'refs/tags/ocr-v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
        run: python tools/publish_ocr_image.py --image "$IMAGE" --version "$VERSION" --visibility public
